<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Autenticação por Código</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1f4068, #162447); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #ffffff; padding: 40px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .card h2 { color: #1f4068; margin-bottom: 20px; }
        .card p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="email"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input[type="email"]:focus { border-color: #1f4068; }
        button { background-color: #e43f5a; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #d1344e; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Acesso ao Sistema</h2>
        <p>Digite o seu email para receber o código de confirmação.</p>
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="seu.email@exemplo.com" required>
            <button type="submit">Avançar</button>
        </form>
    </div>
</body>
</html>
