<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de Código</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1f4068, #162447); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: #ffffff; padding: 40px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .card h2 { color: #1f4068; margin-bottom: 20px; }
        .card p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 22px; text-align: center; letter-spacing: 5px; outline: none; }
        button { background-color: #00b4d8; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #0096c7; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Confirmação</h2>
        <p>Insira o código de 4 dígitos enviado para o seu email.</p>
        <form action="/validar-codigo" method="POST">
            <input type="text" name="codigoDigitado" maxlength="4" placeholder="0000" required>
            <button type="submit">Validar Código</button>
        </form>
    </div>
</body>
</html>
